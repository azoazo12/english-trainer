<title>英文訓練系統 3.0</title>
<style>
:root{--bg:#F4EFE6;--card:#FBF8F2;--ink:#1F2A44;--mut:#5A6580;--line:#E3DAC8;--acc:#F2A541;--teal:#3FA7A0;--onacc:#1F2A44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161D30;--card:#222C47;--ink:#F2EDE3;--mut:#AEB6CC;--line:#34406A}}
:root[data-theme="dark"]{--bg:#161D30;--card:#222C47;--ink:#F2EDE3;--mut:#AEB6CC;--line:#34406A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans TC",system-ui,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px))}
main{max-width:620px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}h3{font-size:16px;margin:10px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:32px;font-weight:700;line-height:1.1}.mut{color:var(--mut);font-size:14px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;cursor:pointer}button.p{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:700}button.t{background:var(--teal);color:#10202B;border-color:var(--teal);font-weight:700}button.small{padding:7px 10px;min-height:36px;font-size:14px}.wide{width:100%}
.chk{width:100%;text-align:left;display:flex;gap:12px;align-items:center;margin-bottom:8px}.chk b{width:26px;height:26px;border-radius:8px;border:2px solid var(--mut);display:inline-flex;align-items:center;justify-content:center;flex:none}.chk.on{border-color:var(--teal)}.chk.on b{background:var(--teal);border-color:var(--teal);color:#10202B}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px;min-height:44px;width:100%}textarea{min-height:90px;resize:vertical}.row input{flex:1;min-width:100px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1 0 20%;border:0;border-radius:0;background:none;min-height:54px;font-size:12px;color:var(--mut);padding:6px 2px}nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--acc)}
.word{font-size:34px;font-weight:700;text-align:center;margin:18px 0 6px}.zh{font-size:23px;text-align:center;min-height:34px;margin-bottom:12px}.tpl{border-left:4px solid var(--teal);padding:8px 12px;background:var(--bg);border-radius:8px;margin:8px 0}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:12px;color:var(--mut)}.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal);border-radius:99px}.feedback{padding:10px;border-radius:10px;background:var(--bg);margin:8px 0}.good{color:#27836f}.warn{color:#b36b12}.rec{color:#C0392B}svg{width:100%;height:auto;display:block}audio{width:100%;margin-top:8px}.hide{display:none!important}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{let [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n))};
const INT=[1,2,4,8,16],SEED=[["introduce","介紹"],["practice","練習"],["usually","通常"],["weather","天氣"],["neighbor","鄰居"],["direction","方向"],["traffic","交通"],["invite","邀請"],["prepare","準備"],["excited","興奮的"],["nervous","緊張的"],["comfortable","舒服的"],["borrow","借"],["delicious","美味的"],["homework","作業"],["breakfast","早餐"],["bathroom","廁所"],["remember","記得"],["understand","了解"],["language","語言"],["share","分享"],["necessary","必要的"],["describe","描述"],["different","不同的"]];
const PROMPTS=["What did you do today?","Tell me about your family.","What is your favorite food? Why?","Describe your school.","What do you do on weekends?","Tell me about Taiwan.","What is your favorite subject? Why?","How do you go to school?","Who is your best friend? Why?","What do you want to do next year?","Describe your room.","What did you eat for dinner?","What would you like to do with your host family?","How can you introduce Taiwan to a friend?"];
const LISTEN=[{title:"After school",text:"After school, I usually go home by bus. I eat a snack and do my homework. Then I talk with my family.",q:"How does the speaker go home?",opts:["By bus","By bike","On foot"],ans:0},{title:"A new friend",text:"I met a new student today. Her name is Mia. She is friendly, and we talked about our favorite music.",q:"What did they talk about?",opts:["Sports","Music","Food"],ans:1},{title:"Weekend plan",text:"This Saturday, I will visit my grandmother. We will cook lunch together and take a walk in the park.",q:"Who will the speaker visit?",opts:["A teacher","A friend","A grandmother"],ans:2},{title:"Taiwanese food",text:"My favorite Taiwanese food is beef noodle soup. It is warm and delicious. I often eat it with my family.",q:"What is the speaker's favorite food?",opts:["Beef noodle soup","Dumplings","Rice"],ans:0}];
const GRAM=[{p:"I want to…",zh:"我想要……",ex:["I want to improve my English.","I want to make new friends."],task:"Write one thing you want to do next year."},{p:"I usually…",zh:"我通常……",ex:["I usually do my homework after school.","I usually get up at seven."],task:"Write one sentence about your daily routine."},{p:"because…",zh:"因為……",ex:["I like English because it is useful.","I am happy because I have a new friend."],task:"Answer: Why do you want to join RYE?"},{p:"There is / There are…",zh:"有……",ex:["There is a park near my house.","There are five people in my family."],task:"Describe your room or your family."},{p:"I have never…",zh:"我從來沒有……",ex:["I have never lived abroad.","I have never tried this food."],task:"Write one thing you have never done."}];
const READ=[{title:"My host family",text:"I will stay with a host family during my exchange. I want to learn about their daily life. I can help with small things, such as setting the table. I will ask questions and share stories about Taiwan.",q:["Where will the student stay?","Name one thing the student can help with."],a:["With a host family","Setting the table"]},{title:"At a new school",text:"On my first day at a new school, I may feel nervous. I will smile, say hello, and introduce myself. If I do not understand something, I can ask the teacher to repeat it slowly.",q:["How may the student feel?","What can the student ask the teacher to do?"],a:["Nervous","Repeat it slowly"]},{title:"Sharing Taiwan",text:"Taiwan has beautiful mountains, busy night markets, and friendly people. I can introduce Taiwanese food and traditions to my new friends. I can also learn about their culture.",q:["Name one thing in Taiwan.","What can the student learn?"],a:["Mountains / night markets / friendly people","Their culture"]}];
const today=ymd();let S;
try{S=JSON.parse(localStorage.getItem('engsys')||'null')}catch(e){S=null}
if(!S||!Array.isArray(S.words))S={log:{},words:SEED.map(([e,z])=>({e,z,b:1,d:today})),speak:[],heard:[]};
S.log=S.log||{};S.speak=S.speak||[];S.heard=S.heard||[];
// Migration: preserve legacy fields and append 2.0 data without resetting the original storage key.
S.v2=S.v2||{tasks:{},listen:[],grammar:[],reading:[],mistakes:[],settings:{theme:'auto',apiUrl:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini',apiKey:''}};
S.v2.tasks=S.v2.tasks||{};S.v2.listen=S.v2.listen||[];S.v2.grammar=S.v2.grammar||[];S.v2.reading=S.v2.reading||[];S.v2.mistakes=S.v2.mistakes||[];S.v2.settings=S.v2.settings||{theme:'auto',apiUrl:'https://api.openai.com/v1/chat/completions',model:'gpt-4o-mini',apiKey:''};
let tab='today',rev=false,rec=null,recSec=0,recTick=null,recUrl=null,recMsg='',recognition=null,recognizing=false,transcribing=false,listenIdx=0,listenPhase=0,listenAnswer=null,readIdx=0,readShown=false,aiBusy=false;
function save(){try{localStorage.setItem('engsys',JSON.stringify(S))}catch(e){alert('儲存空間不足，請先匯出備份。')}}
function logToday(){return S.log[ymd()]||(S.log[ymd()]={l:0,s:0,w:0,r:0})}
function sum(o){return o?(o.l|0)+(o.s|0)+(o.w|0)+(o.r|0):0}
function streak(){let d=ymd();if(!sum(S.log[d])&&!taskCount(d))d=addDays(d,-1);let n=0;while(sum(S.log[d])||taskCount(d)){n++;d=addDays(d,-1)}return n}
function taskCount(d){return Object.values(S.v2.tasks[d]||{}).filter(Boolean).length}
function taskSet(k){let d=ymd();S.v2.tasks[d]=S.v2.tasks[d]||{};S.v2.tasks[d][k]=!S.v2.tasks[d][k];save();render()}
function tick(k){logToday()[k]=1}
const due=()=>S.words.filter(w=>(w.d||today)<=today);
function speakText(text,rate=.82){if(!('speechSynthesis'in window)){recMsg='此瀏覽器不支援語音播放。';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;speechSynthesis.speak(u)}
function bars(vals,labels,max){let W=300,H=110,n=vals.length,bw=W/n,g='';vals.forEach((v,i)=>{let h=max?Math.round(v/max*80):0;g+=`<rect x="${i*bw+6}" y="${90-h}" width="${bw-12}" height="${h}" rx="4" fill="var(--teal)"/><text x="${i*bw+bw/2}" y="104" text-anchor="middle" font-size="10" fill="var(--mut)">${esc(labels[i])}</text><text x="${i*bw+bw/2}" y="${86-h}" text-anchor="middle" font-size="10" fill="var(--ink)">${v}</text>`});return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="長條圖">${g}</svg>`}
function line(vals){if(vals.length<2)return '<p class="mut">至少記錄兩次才會畫出線。</p>';let W=300,H=100,mx=Math.max(...vals,1),mn=Math.min(...vals,0),pts=vals.map((v,i)=>[10+i*(W-20)/(vals.length-1),90-(v-mn)/(mx-mn||1)*75]);return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--acc)" stroke-width="3" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--acc)"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="10" fill="var(--ink)">${vals[i]}</text>`).join('')}</svg>`}
const tasks=[['vocab','單字與句型','複習 3–5 個單字＋今日句型','3 分'],['listen','聽力','聽一段短英文，回答問題','4 分'],['speak','口說','回答一題並錄音或練習說出來','5 分'],['read','閱讀與回顧','讀短文、回答理解題','3 分']];

function startRec(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){recMsg='此瀏覽器不支援錄音。可用手機錄音後，將內容輸入下方文字框練習。';render();return}navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{let chunks=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(recTick);recUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec=null;render()};recSec=0;recUrl=null;rec.start();recTick=setInterval(()=>{recSec++;if(recSec>=60)stopRec();else render()},1000);render()}).catch(()=>{recMsg='無法使用麥克風；請確認瀏覽器權限或改用文字輸入。';render()})}
function stopRec(){if(rec&&rec.state!=='inactive')rec.stop()}
function startRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){recMsg='此瀏覽器不支援語音辨識（建議使用最新版 Chrome 或 Edge）。可以先錄音，再手動輸入英文。';render();return false}
 try{
  recognition=new SR();recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;recognition.maxAlternatives=1;
  recognition.onresult=e=>{
   let finalText='',interim='';
   for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+' ';else interim+=t}
   if(finalText){let cur=window._transcript||'';window._transcript=(cur+' '+finalText).trim().slice(0,2000)}
   let box=$('#spText');if(box){box.value=(window._transcript||'')+(interim?' '+interim:'');box.value=box.value.slice(0,2000);let count=$('#spCount');if(count)count.textContent=box.value.length+'/2000'}
  };
  recognition.onerror=e=>{recMsg='語音辨識訊息：'+e.error+'。若未辨識成功，請確認麥克風權限或改用文字輸入。';};
  recognition.onend=()=>{recognizing=false;recognition=null;transcribing=false;};
  recognition.start();recognizing=true;transcribing=true;return true;
 }catch(e){recMsg='無法啟動語音辨識，請確認麥克風權限。';return false}
}
function stopRecognition(){if(recognition){try{recognition.stop()}catch(e){} }recognizing=false;transcribing=false;recognition=null}
function startRecTrans(){
 window._transcript=($('#spText')?.value||window._transcript||'').slice(0,2000);
 if(!startRecognition()){return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){recMsg='語音辨識已啟動，但此瀏覽器不支援錄音保存。';render();return}
 navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
  let chunks=[];rec=new MediaRecorder(st);rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{st.getTracks().forEach(t=>t.stop());clearInterval(recTick);recUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));rec=null;render()};
  recSec=0;recUrl=null;rec.start();recTick=setInterval(()=>{recSec++;if(recSec>=60)stopCombined();},1000);render();
 }).catch(()=>{stopRecognition();recMsg='無法使用麥克風。請允許麥克風權限後重試。';render()});
}
function stopCombined(){stopRec();stopRecognition();render()}

S.v3=S.v3||{};S.v3.err=S.v3.err||{};S.v3.sc=S.v3.sc||[];S.v3.miss=S.v3.miss||{};

const SCEN=[
{id:'arrive',t:'抵達寄宿家庭',z:'第一天到寄宿家庭，host mother 歡迎你。',q:"Welcome! How was your flight? Are you hungry?",k:[["Thank you for having me.","謝謝你們接待我。"],["I am a little tired, but I am happy to be here.","我有點累，但很高興來到這裡。"],["Can I wash my hands first?","我可以先洗手嗎？"]],kw:['thank','tired','happy']},

const R=[

['country',/\bTaiwanese is\b/gi,()=>'Taiwan is','國家是 Taiwan；Taiwanese 是「台灣人／台灣的」。',['___ is a beautiful country.','Taiwan','Taiwanese']],

['are',/\b(people|friends|students|children) is\b/gi,(m,n)=>n+' are','複數主詞用 are。',['My friends ___ very nice.','are','is']],
['agree',/\bI am agree\b/gi,()=>'I agree','agree 是動詞，前面不加 am。',['I ___ with you.','agree','am agree']],
['like',/\bI am (like|love|want|need)\b/gi,(m,v)=>'I '+v.toLowerCase(),'like / love / want 是動詞，前面不加 am。',['I ___ noodles.','like','am like']],
['age',/\bI have (\d+|\w+) years? old\b/gi,(m,n)=>'I am '+n+' years old','說年齡用 I am … years old。',['I ___ sixteen years old.','am','have']],

function coachLocal(t){let issues=[],out=t;R.forEach(([id,re,fn,zh])=>{out=out.replace(new RegExp(re.source,re.flags),(...a)=>{let r=fn(...a);issues.push({id,w:a[0].trim(),r:r.trim(),zh});return r})});return{issues,out,words:(t.match(/[A-Za-z']+/g)||[]).length,hasB:/because/i.test(t),hasE:/for example/i.test(t)}}
